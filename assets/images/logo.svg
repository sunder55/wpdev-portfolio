<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 390" role="img">
  <title>rukmagat logo – light and dark versions</title>
  <desc>Two logo versions side by side: dark background on the left, light background on the right. Each shows a geometric R mark paired with the wordmark 'rukmagat'.</desc>
  <defs>
    <mask id="img-text-gaps" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="690" height="390" fill="white"/>
      <rect x="168" y="126" width="138.4375" height="37" fill="black" rx="2"/>
      <rect x="168" y="161" width="152.46875" height="17" fill="black" rx="2"/>
      <rect x="176" y="175" width="106.8125" height="17.041015625" fill="black" rx="2"/>
      <rect x="166" y="247" width="177.421875" height="17" fill="black" rx="2"/>
      <rect x="508" y="126" width="138.4375" height="37" fill="black" rx="2"/>
      <rect x="508" y="161" width="152.46875" height="17" fill="black" rx="2"/>
      <rect x="516" y="175" width="106.8125" height="17.041015625" fill="black" rx="2"/>
      <rect x="502.19000244140625" y="247" width="181.890625" height="17" fill="black" rx="2"/>
      <rect x="166" y="288" width="72.28125" height="16" fill="black" rx="2"/>
      <rect x="502.19000244140625" y="288" width="72.28125" height="16" fill="black" rx="2"/>
    </mask>
  </defs>

  <!-- Dark background variant -->
  <rect x="0" y="0" width="340" height="380" fill="#111110"/>
  <rect x="104" y="120" width="56" height="56" rx="6" fill="none" stroke="#1D9E75" stroke-width="2"/>
  <rect x="117" y="132" width="5" height="32" rx="2" fill="#FFFFFF"/>
  <rect x="117" y="132" width="18" height="5" rx="2" fill="#FFFFFF"/>
  <rect x="130" y="132" width="5" height="14" rx="2" fill="#FFFFFF"/>
  <rect x="117" y="143" width="18" height="4.5" rx="2" fill="#FFFFFF"/>
  <line x1="131" y1="147" x2="143" y2="164" stroke="#1D9E75" stroke-width="4.5" stroke-linecap="round"/>
  <text x="172" y="155" fill="#FFFFFF" font-family="Inter, 'DM Sans', system-ui, sans-serif" font-size="28" font-weight="300">rukmagat</text>
  <text x="172" y="174" fill="#5DCAA5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">full-stack developer</text>
  <circle cx="172" cy="185" r="2" fill="#1D9E75"/>
  <text x="180" y="188" fill="#888780" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">rukmagat.com</text>
  <text x="170" y="260" font-family="system-ui" font-size="11" fill="#5F5E5A" letter-spacing="0.12em">FOR DARK BACKGROUNDS</text>
  <line x1="340" y1="30" x2="340" y2="350" stroke="#2C2C2A" stroke-width="1" mask="url(#img-text-gaps)"/>

  <!-- Light background variant -->
  <rect x="340" y="0" width="340" height="380" fill="#F8F7F4"/>
  <rect x="444" y="120" width="56" height="56" rx="6" fill="none" stroke="#0F6E56" stroke-width="2"/>
  <rect x="457" y="132" width="5" height="32" rx="2" fill="#111110"/>
  <rect x="457" y="132" width="18" height="5" rx="2" fill="#111110"/>
  <rect x="470" y="132" width="5" height="14" rx="2" fill="#111110"/>
  <rect x="457" y="143" width="18" height="4.5" rx="2" fill="#111110"/>
  <line x1="471" y1="147" x2="483" y2="164" stroke="#0F6E56" stroke-width="4.5" stroke-linecap="round"/>
  <text x="512" y="155" fill="#111110" font-family="Inter, 'DM Sans', system-ui, sans-serif" font-size="28" font-weight="300">rukmagat</text>
  <text x="512" y="174" fill="#0F6E56" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">full-stack developer</text>
  <circle cx="512" cy="185" r="2" fill="#0F6E56"/>
  <text x="520" y="188" fill="#888780" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">rukmagat.com</text>
  <text x="506.19" y="260" font-family="system-ui" font-size="11" fill="#B4B2A9" letter-spacing="0.12em">FOR LIGHT BACKGROUNDS</text>

  <!-- Separator line -->
  <line x1="40" y1="340" x2="300" y2="340" stroke="#2C2C2A" stroke-width="0.5"/>
  <line x1="380" y1="340" x2="640" y2="340" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="170" y="300" font-family="system-ui" font-size="10" fill="#444441" letter-spacing="0.1em">ICON ONLY</text>
  <text x="506.19" y="300" font-family="system-ui" font-size="10" fill="#B4B2A9" letter-spacing="0.1em">ICON ONLY</text>

  <!-- Icon only - dark -->
  <rect x="130" y="308" width="36" height="36" rx="4" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
  <rect x="139" y="316" width="3.5" height="20" rx="1.5" fill="#FFFFFF"/>
  <rect x="139" y="316" width="12" height="3.5" rx="1.5" fill="#FFFFFF"/>
  <rect x="147.5" y="316" width="3.5" height="9" rx="1.5" fill="#FFFFFF"/>
  <rect x="139" y="323" width="12" height="3" rx="1.5" fill="#FFFFFF"/>
  <line x1="148" y1="326" x2="156" y2="336" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>

  <!-- Icon only - light -->
  <rect x="470" y="308" width="36" height="36" rx="4" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
  <rect x="479" y="316" width="3.5" height="20" rx="1.5" fill="#111110"/>
  <rect x="479" y="316" width="12" height="3.5" rx="1.5" fill="#111110"/>
  <rect x="487.5" y="316" width="3.5" height="9" rx="1.5" fill="#111110"/>
  <rect x="479" y="323" width="12" height="3" rx="1.5" fill="#111110"/>
  <line x1="488" y1="326" x2="496" y2="336" stroke="#0F6E56" stroke-width="3" stroke-linecap="round"/>
</svg>
